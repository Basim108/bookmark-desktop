name: CI

# The manifest and lockfile are in these filters because a change touching only
# them is exactly the kind that most needs checking: a dependency bump decides
# what every job installs. Without them a bump matched no path, ran no job, and
# merged unverified — which is how a TypeScript 7 bump that breaks `npm ci`
# outright reached main twice.
#
# CHANGELOG.md is here because a release-bump commit touches these three
# together, and the release workflow refuses to publish a commit that carries no
# successful check.
on:
  pull_request:
    paths:
      - "src/**"
      - "e2e/**"
      - ".github/**"
      - "package.json"
      - "package-lock.json"
      - "CHANGELOG.md"
  push:
    paths:
      - "src/**"
      - "e2e/**"
      - ".github/**"
      - "package.json"
      - "package-lock.json"
      - "CHANGELOG.md"

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # The breaking-change guard reads the commits since the previous tag,
          # so it needs the tags and the history behind them. The default
          # shallow, tagless checkout would make `git describe` fail and the
          # guard silently treat every commit as in range.
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      # Runs before install because it needs neither: Node 24 strips the types
      # natively and the guard reads only git and two files. A missing heads-up
      # therefore fails in seconds rather than after the whole suite.
      - name: Breaking changes are announced to users
        run: node scripts/check-breaking-change.ts

      - name: Install dependencies
        run: npm ci

      - name: Format check
        run: npm run format

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: E2E tests
        run: npm run test:e2e

      - name: Audit dependencies
        run: npm audit --audit-level=high
